TrajectoryPlannerROS:
  #Independent settings for the local costmap
  transform_tolerance: 0.3
  sim_time: 4.0 #NJ modified default 1.7
  sim_granularity: 0.025 #NJ modified default 0.025
  dwa: true #NJ modified default true
  vx_samples: 10 #NJ modified from 3
  vtheta_samples: 30
  max_vel_x: 0.5 #Changed from 0.5
  min_vel_x: -0.1 #NJ modified default 0.1
  escape_vel: -0.1
  max_rotational_vel: 0.4 #Modified from default 1.0
  min_in_place_vel_theta: 0.4 #NJ modified from default 0.4
  xy_goal_tolerance: 0.5   #NJ- modified from default 0.2
  yaw_goal_tolerance: 0.1  #radians, NJ modified from default 0.1
  goal_distance_bias: 20.0 #NJ modified from 0.2
  path_distance_bias: 32.0 #NJ modified from 0.9
  occdist_scale: 0.02 #NJ modified from 0.01
  heading_lookahead: 0.325 #NJ modified default 0.325
  oscillation_reset_dist: 0.05
  holonomic_robot: false
  acc_lim_theta: 3.2
  acc_lim_x: 2.5 #NJ modified default 2.5
  acc_lim_y: 2.5 #NJ modified default 2.5
  heading_scoring: false
  heading_scoring_timestep: 0.8 #NJ modified default 0.8
  simple_attractor: false
  meter_scoring: true
